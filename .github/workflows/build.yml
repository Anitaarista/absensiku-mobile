name: EAS Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'SETUP.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Validate project before building
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          ERROR_COUNT=0
          for file in $(find src -name "*.js"); do
            if ! node -c "$file" 2>/dev/null; then
              echo "::error file=$file::Syntax error"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "❌ $ERROR_COUNT files have syntax errors"
            exit 1
          fi
          echo "✅ All source files pass syntax check"

      - name: Validate config files
        run: |
          node -e "const app = require('./app.json'); console.log('✅ App:', app.expo.name, 'v' + app.expo.version)"
          node -e "const pkg = require('./package.json'); console.log('✅ Package:', pkg.name, 'v' + pkg.version)"
          node -e "const eas = require('./eas.json'); console.log('✅ EAS profiles:', Object.keys(eas.build).join(', '))"

  # Job 2: EAS Build Android
  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform != 'ios' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (Android)
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.build_profile || 'preview' }} \
            --non-interactive \
            --wait \
            --output ./build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: absensiku-android-${{ github.event.inputs.build_profile || 'preview' }}
          path: ./build-output/*.apk
          retention-days: 30
          if-no-files-found: warn

  # Job 3: EAS Build iOS
  build-ios:
    name: Build iOS IPA
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (iOS)
        run: |
          eas build \
            --platform ios \
            --profile ${{ github.event.inputs.build_profile || 'preview' }} \
            --non-interactive \
            --wait \
            --output ./build-output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: absensiku-ios-${{ github.event.inputs.build_profile || 'preview' }}
          path: ./build-output/*.ipa
          retention-days: 30
          if-no-files-found: warn

  # Job 4: Summary
  build-summary:
    name: Build Summary
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build result
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ github.event.inputs.build_profile || 'preview' }}" >> $GITHUB_STEP_SUMMARY
