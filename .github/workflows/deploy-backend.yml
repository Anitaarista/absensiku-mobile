name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Validate server syntax
        run: cd backend && node -c server.js && echo "✅ Syntax OK"

      - name: Deploy to hosting
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_CREDENTIAL }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          PORT: ${{ secrets.PORT || 3000 }}
        run: |
          echo "📦 Deploying AbsensiKu Backend API..."
          echo ""
          echo "🔧 Configure your deployment target:"
          echo "   - Railway: Set DEPLOY_HOOK secret + connect repo"
          echo "   - Render: Connect GitHub repo in dashboard"
          echo "   - Fly.io: Use fly deploy command"
          echo "   - Google Cloud Run: Use gcloud run deploy"
          echo ""
          echo "Required secrets for deployment:"
          echo "   FIREBASE_CREDENTIAL - Firebase Admin SDK JSON (entire file content)"
          echo "   FIREBASE_DATABASE_URL - Firebase DB URL"
          echo ""
          
          # Auto-deploy via webhook if configured
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "🚀 Triggering deployment via webhook..."
            curl -X POST "$DEPLOY_HOOK" -s -o /dev/null -w "HTTP %{http_code}\n"
          else
            echo "⚠️ No DEPLOY_HOOK secret configured. Manual deployment required."
          fi
