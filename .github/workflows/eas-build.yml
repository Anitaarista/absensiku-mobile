name: EAS Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'SETUP.md'
      - '.gitignore'
      - '.env.example'
      - 'README.md'
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          ERROR_COUNT=0
          for file in $(find src -name "*.js"); do
            if ! node -c "$file" 2>/dev/null; then
              echo "::error file=$file::Syntax error"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "❌ $ERROR_COUNT files have syntax errors"
            exit 1
          fi
          echo "✅ All source files pass syntax check"

      - name: Validate config files
        run: |
          node -e "const app = require('./app.json'); console.log('✅ App:', app.expo.name, 'v' + app.expo.version)"
          node -e "const pkg = require('./package.json'); console.log('✅ Package:', pkg.name, 'v' + pkg.version)"
          node -e "const eas = require('./eas.json'); console.log('✅ EAS profiles:', Object.keys(eas.build).join(', '))"

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (Android)
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.build_profile || 'preview' }} \
            --non-interactive \
            --wait
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Download APK
        if: success()
        run: |
          mkdir -p artifacts
          BUILD_ID=$(eas build:list --platform android --limit 1 --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$BUILD_ID" ]; then
            eas build:download --id "$BUILD_ID" --output-dir ./artifacts/ || echo "Download failed, build available on Expo dashboard"
          else
            echo "Could not determine build ID, check Expo dashboard"
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: absensiku-android-${{ github.event.inputs.build_profile || 'preview' }}
          path: ./artifacts/*.apk
          retention-days: 30
          if-no-files-found: warn

  build-summary:
    name: Build Summary
    needs: [build-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build result
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ github.event.inputs.build_profile || 'preview' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download from: https://expo.dev/accounts/hyperlot999/projects/absensiku-mobile/builds" >> $GITHUB_STEP_SUMMARY
