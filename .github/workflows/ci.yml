name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate config files
        run: |
          node -e "const app = require('./app.json'); console.log('✅ App:', app.expo.name, 'v' + app.expo.version)"
          node -e "const pkg = require('./package.json'); console.log('✅ Package:', pkg.name, 'v' + pkg.version)"
          node -e "const eas = require('./eas.json'); console.log('✅ EAS profiles:', Object.keys(eas.build).join(', '))"

      - name: Check syntax
        run: |
          ERROR_COUNT=0
          for file in $(find src -name "*.js"); do
            if ! node -c "$file" 2>/dev/null; then
              echo "::error file=$file::Syntax error"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "❌ $ERROR_COUNT files have syntax errors"
            exit 1
          fi
          echo "✅ All source files pass syntax check"

      - name: Validate backend
        run: |
          cd backend
          npm ci
          node -c server.js
          echo "✅ Backend syntax OK"

  # Auto-build Android APK on main push
  build-android:
    name: Build Android APK
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android Preview APK
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download & Upload APK
        if: success()
        run: |
          mkdir -p artifacts
          BUILD_ID=$(eas build:list --platform android --limit 1 --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$BUILD_ID" ]; then
            eas build:download --id "$BUILD_ID" --output-dir ./artifacts/ || echo "APK available on Expo dashboard"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: absensiku-android-preview
          path: ./artifacts/*.apk
          retention-days: 30
          if-no-files-found: warn
