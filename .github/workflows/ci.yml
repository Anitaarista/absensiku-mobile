name: CI Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check project structure
        run: |
          echo "Checking project structure..."
          test -f App.js && echo "✅ App.js found"
          test -f app.json && echo "✅ app.json found"
          test -f babel.config.js && echo "✅ babel.config.js found"
          test -f eas.json && echo "✅ eas.json found"
          test -d src && echo "✅ src/ directory found"
          test -d src/screens && echo "✅ src/screens/ directory found"
          test -d src/navigation && echo "✅ src/navigation/ directory found"
          test -d src/context && echo "✅ src/context/ directory found"
          test -d src/services && echo "✅ src/services/ directory found"
          test -d backend && echo "✅ backend/ directory found"
          test -f backend/server.js && echo "✅ backend/server.js found"

      - name: Validate app.json
        run: |
          node -e "const cfg = require('./app.json'); console.log('App:', cfg.expo.name, '| Version:', cfg.expo.version, '| Android:', cfg.expo.android.package)"

      - name: Validate eas.json
        run: |
          node -e "const cfg = require('./eas.json'); console.log('EAS profiles:', Object.keys(cfg.build).join(', '))"

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Verify backend server syntax
        run: |
          cd backend
          node -c server.js && echo "✅ server.js syntax OK"
