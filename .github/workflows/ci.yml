name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate config files
        run: |
          node -e "const app = require('./app.json'); console.log('✅ App:', app.expo.name, 'v' + app.expo.version)"
          node -e "const pkg = require('./package.json'); console.log('✅ Package:', pkg.name, 'v' + pkg.version)"
          node -e "const eas = require('./eas.json'); console.log('✅ EAS profiles:', Object.keys(eas.build).join(', '))"

      - name: Check syntax
        run: |
          ERROR_COUNT=0
          for file in $(find src -name "*.js"); do
            if ! node -c "$file" 2>/dev/null; then
              echo "::error file=$file::Syntax error"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "❌ $ERROR_COUNT files have syntax errors"
            exit 1
          fi
          echo "✅ All source files pass syntax check"

      - name: Validate backend
        run: |
          cd backend
          npm ci
          node -c server.js
          echo "✅ Backend syntax OK"

  # Auto-trigger EAS Build on main branch push
  trigger-build:
    name: Trigger EAS Build
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --wait
